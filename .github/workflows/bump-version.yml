name: Bump qBittorrent Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New qBittorrent version (e.g., 5.1.3)'
        required: true
        type: string
      create_release:
        description: 'Create a GitHub release after build completes'
        required: false
        type: boolean
        default: true
      check_upstream:
        description: 'Verify version exists in qBittorrent releases'
        required: false
        type: boolean
        default: true

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Expected format: X.Y.Z (e.g., 5.1.3)"
            exit 1
          fi
          echo "Version format is valid: $VERSION"

      - name: Check upstream release exists
        if: ${{ github.event.inputs.check_upstream == 'true' }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Checking if qBittorrent release-${VERSION} exists..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/qbittorrent/qBittorrent/releases/tags/release-${VERSION}")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::qBittorrent release-${VERSION} not found upstream (HTTP $HTTP_STATUS)"
            echo "Check available releases at: https://github.com/qbittorrent/qBittorrent/releases"
            exit 1
          fi
          echo "Upstream release verified: release-${VERSION}"

      - name: Get current version
        id: current
        run: |
          CURRENT_VERSION=$(cat VERSION)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Check if version is different
        run: |
          NEW_VERSION="${{ github.event.inputs.version }}"
          CURRENT_VERSION="${{ steps.current.outputs.current_version }}"

          if [ "$NEW_VERSION" == "$CURRENT_VERSION" ]; then
            echo "::warning::New version ($NEW_VERSION) is the same as current version"
          fi

      - name: Update VERSION file
        run: |
          echo "${{ github.event.inputs.version }}" > VERSION

      - name: Update Dockerfile
        run: |
          sed -i 's/ARG QBITTORRENT_VERSION=.*/ARG QBITTORRENT_VERSION=${{ github.event.inputs.version }}/' Dockerfile

      - name: Update docker-build.yml
        run: |
          # This is a fallback update - the workflow now reads from VERSION file
          # but we keep the hardcoded value in sync for reference
          sed -i 's/QBITTORRENT_VERSION=.*/QBITTORRENT_VERSION=${{ github.event.inputs.version }}/' .github/workflows/docker-build.yml

      - name: Update README.md
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Update version in features list (line ~29)
          sed -i "s/\*\*qBittorrent\*\*: v[0-9]\+\.[0-9]\+\.[0-9]\+/**qBittorrent**: v${VERSION}/" README.md
          # Update version in build info section (line ~205)
          sed -i "s/\*\*qBittorrent\*\*: v[0-9]\+\.[0-9]\+\.[0-9]\+ (compiled from source)/**qBittorrent**: v${VERSION} (compiled from source)/" README.md

      - name: Verify changes
        run: |
          echo "=== VERSION file ==="
          cat VERSION
          echo ""
          echo "=== Dockerfile (QBITTORRENT_VERSION line) ==="
          grep "ARG QBITTORRENT_VERSION" Dockerfile
          echo ""
          echo "=== README.md (version mentions) ==="
          grep -n "qBittorrent.*v[0-9]" README.md || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add VERSION Dockerfile .github/workflows/docker-build.yml README.md
          git commit -m "Bump qBittorrent to v${{ github.event.inputs.version }}"

      - name: Push changes
        run: |
          git push

      - name: Create and push tag
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          git tag -a "$VERSION" -m "qBittorrent $VERSION"
          git push origin "$VERSION"
          echo "Created and pushed tag: $VERSION"

      - name: Summary
        run: |
          echo "## Version Bump Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous version**: ${{ steps.current.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New version**: ${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag created**: v${{ github.event.inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The docker-build workflow will be triggered automatically by the new tag." >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.create_release }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "A GitHub Release will be created after the Docker image is published." >> $GITHUB_STEP_SUMMARY
          fi
